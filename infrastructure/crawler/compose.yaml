services:
  renderer:
    image: ghcr.io/puppeteer/puppeteer:24.42.0
    restart: unless-stopped
    init: true
    command: [node, /home/pptruser/server.cjs]
    # Chromium's own sandbox must work. Do not add --no-sandbox to make a host pass.
    cap_add: [SYS_ADMIN]
    read_only: true
    shm_size: 1gb
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    tmpfs: [/tmp:size=512m]
    volumes: [./server.cjs:/home/pptruser/server.cjs:ro]
    environment:
      CRAWLER_RENDERER_TOKEN: ${CRAWLER_RENDERER_TOKEN:?Set a random token of at least 32 characters}
      XDG_CONFIG_HOME: /tmp/chromium-config
      XDG_CACHE_HOME: /tmp/chromium-cache
    ports: [127.0.0.1:3000:3000]
    networks: [isolated]
  proxy:
    image: python:3.13-alpine
    restart: unless-stopped
    command: [python, /proxy.py]
    user: '65534:65534'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    volumes: [./proxy.py:/proxy.py:ro]
    networks: [isolated, egress]
networks:
  isolated:
    internal: true
  egress: {}
