ServerName localhost
Listen ${PORT}

<VirtualHost *:${PORT}>
    DocumentRoot /app/public
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    # Railway probes an internal host. Keep Laravel's tenant host checks on
    # every application route while letting the probe reach Laravel's /up.
    RequestHeader set Host "localhost" "expr=%{HTTP_HOST} == 'healthcheck.railway.app' && %{THE_REQUEST} =~ m#^(GET|HEAD) /up HTTP/#"

    <Directory /app/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        DirectoryIndex index.php
        FallbackResource /index.php
        CGIPassAuth On
        Require all granted

        <FilesMatch "(?i)\.(php[0-9]*|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    <LocationMatch "^/index\.php$">
        SetHandler application/x-httpd-php
        Require all granted
    </LocationMatch>
</VirtualHost>
