name: CI

# Forge is triggered by deploy.yml only after this entire workflow succeeds.
# Build once here, test that output, and publish the exact bytes for deployment.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # This runner includes PostgreSQL 16. Pin it so ubuntu-latest upgrades do
    # not silently change the database major version.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          # check-baseline-growth compares against the merge base, which needs
          # more than a shallow clone.
          fetch-depth: 0

      # Use pgvector's documented runner installation instead of a Docker Hub
      # service image: unauthenticated pulls can fail before any step runs.
      # https://github.com/pgvector/setup-pgvector#ubuntu
      - name: Set up PostgreSQL 16 with pgvector
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --no-install-recommends -y postgresql-16-pgvector
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set=ON_ERROR_STOP=1 --command="ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres createdb --owner=postgres testing
          export PGPASSWORD=postgres
          test "$(psql --host=localhost --username=postgres --dbname=testing --tuples-only --no-align --command="SELECT current_setting('server_version_num')::int / 10000")" = 16
          psql --host=localhost --username=postgres --dbname=testing --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION vector;
          SELECT extversion FROM pg_extension WHERE extname = 'vector';
          SELECT '[1,2,3]'::vector <-> '[1,2,3]'::vector AS vector_distance;
          SQL

      - uses: shivammathur/setup-php@v2
        with:
          # Match production's PHP 8.5 runtime. Upgrade Forge before raising this.
          php-version: '8.5'
          extensions: pgsql, pdo_pgsql, grpc, bcmath, intl
          coverage: none

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-php-8.5-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      # Every Inertia page is resolved through the Vite manifest at render time,
      # so without a build the whole feature suite fails on "Unable to locate
      # file in Vite manifest" — a missing build step reading as twenty broken
      # tests.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build production frontend
        env:
          # These are public browser settings, never Stripe secret keys.
          # PRs use fixtures; master must have the real repository variables.
          VITE_APP_NAME: ${{ github.event_name == 'pull_request' && 'Site to Spend CI' || vars.VITE_APP_NAME }}
          VITE_STRIPE_KEY: ${{ github.event_name == 'pull_request' && 'pk_test_ci_fixture' || vars.VITE_STRIPE_KEY }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test -n "$VITE_APP_NAME"
            test -n "$VITE_STRIPE_KEY"
          fi
          python3 - <<'PYTHON'
          import os, runpy
          artifact = runpy.run_path('bin/frontend-artifact')
          artifact['public_config']({key: os.environ.get(key) for key in artifact['PUBLIC_KEYS']})
          PYTHON
          npm run build

      - name: Formatting
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      # The two checks that would have caught every runtime-fatal bug this
      # codebase has shipped.
      - name: No references to missing classes or methods
        run: ./bin/check-fatal-classes

      - name: Baseline has not grown
        run: ./bin/check-baseline-growth origin/master

      # Three crashes in one day came from an identifier that did not exist in
      # the scope using it — a null href, `campaigns`, `setupOnly` — and every
      # one shipped through a green suite, because nothing statically checked
      # the JSX. no-undef is exactly that check and the whole of resources/js
      # passes it.
      - name: Frontend lint
        run: npm run lint

      # CLAUDE.md's pre-commit checklist has always listed `npm test`; CI built
      # the frontend and never ran its suite, so the nine vitest files only ran
      # when someone remembered.
      - name: Crawler boundary and deployment gate checks
        run: |
          python3 -m unittest discover -s infrastructure/crawler -p 'test_*.py'
          python3 -m unittest discover -s tests/Infrastructure -p 'test_*.py'
          node --check infrastructure/crawler/server.cjs

      - name: Frontend tests
        run: npm test

      - name: Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: |
          cp .env.example .env || true
          php artisan key:generate --force
          php artisan test

      - name: Package tested frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_STRIPE_KEY: ${{ vars.VITE_STRIPE_KEY }}
        run: |
          python3 bin/frontend-artifact pack --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --output-dir "$RUNNER_TEMP/frontend-artifact"

      - name: Pass tested assets to publisher
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-artifact/
          if-no-files-found: error
          retention-days: 7

  publish-frontend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: frontend-artifact

      - name: Publish immutable build for this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq '.object.sha')" = "$GITHUB_SHA"
          tag="frontend-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" frontend-artifact/frontend-build.tar.gz frontend-artifact/receipt.json \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Frontend $GITHUB_SHA (run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT)" \
            --notes "Tested production assets. Installed by Forge only after the complete CI run succeeds."
